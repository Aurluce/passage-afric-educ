name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: passage
          POSTGRES_USER: passage_app
          POSTGRES_PASSWORD: ChangeMe_2026!
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U passage_app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SECRET_KEY: "ci-secret-key-for-tests-only-not-a-real-secret"
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: "127.0.0.1,localhost"
      DB_NAME: passage
      DB_USER: passage_app
      DB_PASSWORD: ChangeMe_2026!
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      AI_PROVIDER: groq
      AI_API_KEY: ""
      AI_MODEL: openai/gpt-oss-20b
      AI_COST_CAP_EUR_PER_DAY: "1.00"
      PARENT_MSG_DAILY_CAP: "3"
    steps:
      - uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Vérifier Django
        working-directory: backend
        run: python manage.py check

      - name: Appliquer les migrations
        working-directory: backend
        run: python manage.py migrate

      - name: Lancer les tests
        working-directory: backend
        run: pytest passage/tests/ -v
